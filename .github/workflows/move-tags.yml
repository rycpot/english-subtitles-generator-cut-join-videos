name: Move release tags (one-off)
on:
  push:
    branches: [main]
    paths: [.github/workflows/move-tags.yml]
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point each tag at its cleaned commit
        run: |
          set -euo pipefail
          while read -r tag sha; do
            git cat-file -e "$sha^{commit}"
            git tag -f "$tag" "$sha"
          done <<'MAP'
          v1.0.0 95df683a8a93f59ac7fca5c9c371f236125c8600
          v1.1.0 e270f5c44aa4b52c9d4646f7e58dc9676a239f02
          v1.2.0 baa1d353420cd6a4a21a745b2fc167aeb49fe111
          v1.2.1 7e9bc2b0913b5793310812abfd1e952683a689c7
          v1.3.0 dd412f3c590b7f1ff12aa440d46ba0cac4a273bf
          v1.3.1 d33a53be06d0812631423361e361a16b63b64a53
          v1.4.0 068f3875cbab8d9e1221dac9cedf98db0c790afe
          v1.5.0 3bfcc6beb43191fd10724c687b0045055c27f9b9
          v1.5.1 0f25d205ed9afcc38a1326889427fad028418f75
          v1.5.2 da4e57f49c4f3407bb5ae3993b86156ca44e9a24
          MAP
          git push --force origin --tags
          git ls-remote --tags origin
